services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - taskflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow -d taskflow']
      interval: 2s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow_test
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow -d taskflow_test']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  taskflow-data:
