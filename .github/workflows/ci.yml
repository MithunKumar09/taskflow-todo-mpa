name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      API_PORT: '3000'
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:taskflow@127.0.0.1:5432/taskflow
      TEST_DATABASE_URL: postgresql://postgres:taskflow@127.0.0.1:5432/taskflow_ci_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:test:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Postman contract checks
        env:
          API_PORT: '3100'
          DATABASE_URL: postgresql://postgres:taskflow@127.0.0.1:5432/taskflow_ci_test
        run: |
          node apps/api/dist/server.js > api-test.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/health; then break; fi
            sleep 1
          done
          npm run postman:test -- --env-var baseUrl=http://127.0.0.1:3100
      - name: Failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: certification-failure
          path: |
            playwright-report/
            test-results/
            api-test.log
          retention-days: 7
